name: Release

# Push a tag like v1.0.0-alpha.1 to build installers for all three platforms
# and attach them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Downloads (npm, Electron headers for node-pty) fail now and then on hosted runners; try again.
      - name: Install
        shell: bash
        run: npm ci || (sleep 15 && npm ci) || (sleep 45 && npm ci)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          node -e "
            const v = process.argv[1].replace(/^v/, '')
            const log = require('fs').readFileSync('CHANGELOG.md', 'utf8')
            const start = log.indexOf('## [' + v + ']')
            const rest = start < 0 ? '' : log.slice(log.indexOf('\\n', start) + 1)
            const end = rest.search(/^## \\[/m)
            require('fs').writeFileSync('notes.md', (end < 0 ? rest : rest.slice(0, end)).trim() + '\\n')
          " "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
