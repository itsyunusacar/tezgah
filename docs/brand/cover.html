<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Geist; src: url('../../src/renderer/src/assets/fonts/Geist-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: Geist; src: url('../../src/renderer/src/assets/fonts/Geist-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: Geist; src: url('../../src/renderer/src/assets/fonts/Geist-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Geist Mono'; src: url('../../src/renderer/src/assets/fonts/GeistMono-Regular.ttf'); }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: Geist; color: #0C0B0A; position: relative; background: #F5F3F1; }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(#E7E3DE 1px, transparent 1px), linear-gradient(90deg, #E7E3DE 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .mark { width: 70px; height: 60px; color: #0C0B0A; }
  h1 { margin: 24px 0 14px; font-size: 76px; line-height: 1; font-weight: 600; letter-spacing: -2.6px; }
  p { margin: 0; font-size: 24px; line-height: 1.4; color: #5C5751; letter-spacing: -0.3px; }
  .agents { display: flex; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
  .agents span {
    font-size: 15px; font-weight: 500; padding: 6px 13px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2DDD7; color: #1A1918;
    display: inline-flex; align-items: center; gap: 7px; box-shadow: 0 1px 2px rgba(12,11,10,.05);
  }
  .agents i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .os { margin-top: 18px; font: 14px 'Geist Mono'; color: #8A847C; letter-spacing: 0.2px; }
  .shot {
    position: absolute; left: 590px; top: 92px; width: 900px; border-radius: 16px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 70px rgba(12,11,10,.16), 0 0 0 1px #E2DDD7;
  }
  .shot img { display: block; width: 100%; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <svg class="mark" viewBox="16 23 68 58" fill="currentColor"><rect x="16" y="45" width="68" height="12" rx="3"/><rect x="25" y="50" width="10" height="31" rx="2"/><rect x="65" y="50" width="10" height="31" rx="2"/><rect x="27" y="23" width="13" height="18" rx="2"/></svg>
    <h1>Tezgah</h1>
    <p id="tagline">A terminal for working with AI coding agents. Every agent, and what it's doing, at a glance.</p>
    <div class="agents">
      <span><i style="background:#D77757"></i>Claude Code</span>
      <span><i style="background:#9AA0A6"></i>Codex</span>
      <span><i style="background:#7FA6F5"></i>Gemini</span>
      <span><i style="background:#1A1918"></i>Grok</span>
    </div>
    <div class="os" id="os">v1.0 · macOS · Windows · Linux · free &amp; open source</div>
  </div>
  <div class="shot"><img id="shot" src="../images/raw-hero-en.png"></div>
  <script>
    const q = new URLSearchParams(location.search)
    if (q.get('lang') === 'tr') {
      document.getElementById('tagline').textContent = 'Yapay zekâ kodlama ajanlarıyla çalışmak için bir terminal. Her ajan ve ne yaptığı, tek bakışta.'
      document.getElementById('os').textContent = 'v1.0 · macOS · Windows · Linux · ücretsiz ve açık kaynak'
      document.getElementById('shot').src = '../images/raw-hero-tr.png'
    }
  </script>
</body></html>
