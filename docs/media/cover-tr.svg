<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="Tezgah: ajanların için terminal, projelerin için merkez">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F4C8C"/>
      <stop offset=".55" stop-color="#6F90C9"/>
      <stop offset="1" stop-color="#C3D5EE"/>
    </linearGradient>
    <radialGradient id="light" cx=".82" cy="0" r=".6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E7E3DE" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1600" height="640" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1600" height="640" fill="#F8F6F4"/>
    <rect y="470" width="1600" height="170" fill="url(#grid)"/>
    <rect width="1600" height="470" fill="url(#sky)"/>
    <rect width="1600" height="470" fill="url(#light)"/>
    <!-- the bench, standing on the horizon: one outline with 3-unit fillets, and its cursor block -->
    <g transform="translate(1180 208) scale(4.5)" fill="#FFFFFF">
      <path d="M3 22H65a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-3a3 3 0 0 0-3 3v19a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V37a3 3 0 0 0-3-3H22a3 3 0 0 0-3 3v19a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V37a3 3 0 0 0-3-3H3a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3Z"/>
      <rect x="11" y="0" width="13" height="18" rx="2"/>
    </g>
    <text x="120" y="250" font-family="Geist, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="104" font-weight="600" letter-spacing="-4" fill="#FFFFFF">Tezgah</text>
    <text x="124" y="322" font-family="Geist, -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="34" fill="#FFFFFF" fill-opacity=".9">Ajanların için terminal, projelerin için merkez.</text>
    <text x="124" y="560" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="22" fill="#5C5751">yerel macOS · Claude Code · Codex · Grok · ve eklediğin her ajan</text>
  </g>
</svg>
