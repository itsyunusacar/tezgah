name: TezgahMac
options:
  bundleIdPrefix: dev.tezgah.mac
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, tr, Base]
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 2.2.2026103001
targets:
  TezgahCore:
    type: framework
    platform: macOS
    sources: [Sources/TezgahCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tezgah.mac.dev.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Tezgah:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tezgah
        excludes: ["Resources/Fonts/OFL-Geist.txt"]
      - path: Sources/Tezgah/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - target: TezgahCore
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: Sparkle
    settings:
      base:
        PRODUCT_MODULE_NAME: Tezgah
        INFOPLIST_FILE: Sources/Tezgah/Support/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Tezgah/Support/Bridging.h
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_NAME: "Tezgah Dev"
          PRODUCT_BUNDLE_IDENTIFIER: dev.tezgah.mac.dev
        Release:
          PRODUCT_NAME: "Tezgah"
          PRODUCT_BUNDLE_IDENTIFIER: dev.tezgah.app
  TezgahCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TezgahCoreTests]
    dependencies:
      - target: TezgahCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tezgah.mac.dev.tests
schemes:
  Tezgah:
    build:
      targets:
        Tezgah: all
        TezgahCoreTests: [test]
    test:
      targets: [TezgahCoreTests]
    run:
      config: Debug
